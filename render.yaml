databases:
  - name: timbradas-db
    plan: free
    databaseName: timbradas
    user: timbradas

services:
  - type: web
    name: timbradas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timbradas-db
          property: connectionString
      - key: PORT
        value: "3000"
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: MIN_SECONDS_BETWEEN_REGISTRATIONS
        value: "5"
      - key: GEOLOCATION_ENABLED
        value: "false"
